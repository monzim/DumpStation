# DumpStation — server + web UI + metadata database.
# Direct backups work out of the box. Agents (for private databases) are
# deployed separately next to those databases; see deploy/agent/.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dumpstation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backup_service}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [dumpstation_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backup_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  dumpstation:
    image: ghcr.io/monzim/dumpstation:${DUMPSTATION_VERSION:-latest}
    container_name: dumpstation
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      DB_NAME: ${POSTGRES_DB:-backup_service}
      DB_SSLMODE: disable

      # Required secrets
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      DUMPSTATION_SECRET_KEY: ${DUMPSTATION_SECRET_KEY:?Encryption key required (openssl rand -base64 32)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}

      # Public URL agents and browsers use to reach this server
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

      # Sign-in
      SYSTEM_USERNAME: ${SYSTEM_USERNAME:-admin}
      SYSTEM_EMAIL: ${SYSTEM_EMAIL:-admin@dumpstation.local}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      OTP_EXPIRATION_MINUTES: ${OTP_EXPIRATION_MINUTES:-5}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      APP_ENV: ${APP_ENV:-production}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}

      # Backup execution
      BACKUP_CONCURRENCY: ${BACKUP_CONCURRENCY:-2}
      BACKUP_TIMEOUT_MINUTES: ${BACKUP_TIMEOUT_MINUTES:-360}
      AGENT_JOB_QUEUE_TTL_MINUTES: ${AGENT_JOB_QUEUE_TTL_MINUTES:-360}
      DIRECT_ALLOWED_CIDRS: ${DIRECT_ALLOWED_CIDRS:-}
    volumes:
      - backup_tmp:/tmp/dumpstation
    ports:
      - "${DUMPSTATION_PORT:-8080}:8080"
    networks: [dumpstation_internal, dumpstation_external]
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }

networks:
  dumpstation_internal:
    internal: true
  dumpstation_external: {}

volumes:
  postgres_data:
    name: dumpstation_postgres_data
  backup_tmp:
    name: dumpstation_backup_tmp
